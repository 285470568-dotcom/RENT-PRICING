[server]
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# 侧栏默认收起；用户可点左上角展开
[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1c1915"
backgroundColor = "#f7f4ee"
secondaryBackgroundColor = "#efe8dc"
textColor = "#1a1814"
